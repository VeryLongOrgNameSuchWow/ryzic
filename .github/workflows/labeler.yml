name: Labeler

# Auto-applies area:* labels to PRs based on the changed-files paths matched
# in `.github/labeler.yml`. Saves manual triage; lets dashboards filter by
# area.
#
# `pull_request_target` runs with the BASE repo's workflow file + write
# permissions to the labels — same as the labeler README's recommended setup.
# Note: this means we never run untrusted PR code; the workflow only reads
# the changed-file list from the GitHub event payload, never executes the PR
# branch's contents.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6.2.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
