name: release-please

# Watches conventional-commit messages on `main` and opens (or updates) a
# release PR that bumps `[project].version` in `pyproject.toml` and prepends
# an entry to `CHANGELOG.md`. Merging the release PR triggers
# release-please-action to create the corresponding `vX.Y.Z` tag and GitHub
# Release; that tag then fires `release.yml` which builds and pushes a Docker
# image to GHCR.
#
# The cut is hands-off as long as conventional commits are clean. See
# `RELEASING.md` for the full flow + the bump table.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # release-please pushes the release-PR branch and creates the tag/release on merge
      pull-requests: write    # opens/updates the release PR
    steps:
      # Mint an installation token from the vlonsw-release-please GitHub App
      # (App ID + private key in repo secrets) instead of falling through to
      # the workflow's default GITHUB_TOKEN. Tags and PRs created via
      # GITHUB_TOKEN do not fire downstream workflows — that's GitHub's
      # anti-loop rule — which would mean release-please's tag push silently
      # skips `release.yml` (GHCR publish + GitHub Release). An App token has
      # no such restriction, so the cut becomes fully hands-off.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-pin compose.yaml's image tag to the new major.minor whenever the
      # release-please PR's manifest version changes the major or minor part.
      # This keeps `docker compose pull` semantics aligned with the latest
      # release line (operators don't have to remember to manually edit the
      # tag on each minor bump). release-please itself doesn't expose a
      # major.minor extra-files updater (only `version` / `major` / `minor`
      # individually, and the image tag has both on one line), so we patch
      # the file on the release-PR branch directly and let the maintainer
      # see the diff before merging the release PR.
      - name: Pin compose.yaml image tag to release major.minor
        # NOTE (2026-05-06): no ``if:`` conditional. ``release-please-action``
        # sets ``prs_created=true`` whenever it OPENS or MATERIALLY UPDATES
        # the release PR; runs that find the existing PR body unchanged set
        # ``prs_created=false``. Combined with the prior bug A (clone-time
        # auth failure on every run that fired), this is why neither v0.4.0
        # nor v0.5.0 had compose.yaml auto-bumped. The in-script
        # ``if [ -z "$branch" ]; then exit 0; fi`` already short-circuits
        # non-release pushes idempotently, so the conditional was always
        # belt-and-suspenders.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRS_JSON: ${{ steps.release-please.outputs.prs }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.[0].headBranchName // empty' <<<"$PRS_JSON")
          if [ -z "$branch" ]; then
            echo "release-please opened no PR; nothing to pin"
            exit 0
          fi
          # release-please-action runs against the API, so we have no working
          # tree at this point — materialize the release-PR branch into a
          # scratch dir to read its manifest and apply the pin. We use the
          # ``actions/checkout``-style ``git init`` + ``git config
          # http.<server>/.extraheader`` + ``git fetch`` + ``git checkout``
          # pattern rather than ``git clone -c http.<URL>.extraheader=...``
          # because ``git -c`` on the clone empirically failed to authenticate
          # (v0.5.1's partial fix #123 hit this; the clone fell back to
          # interactive prompting and failed with "could not read Username").
          # The local-config form via ``git init`` + ``git config`` works
          # reliably and is what ``actions/checkout`` itself uses internally
          # (see actions/checkout ``src/git-auth-helper.ts``: same
          # ``http.${serverUrl.origin}/.extraheader`` key shape). Storing the
          # token in the workdir's ``.git/config`` is acceptable: the workdir
          # is ``mktemp -d`` and is discarded with the runner; the token is
          # never written to any path that survives the workflow run.
          #
          # The ``http.<server>/.extraheader`` key is URL-scoped — git's
          # URL-prefix matching limits the override to requests starting with
          # ``${SERVER}/`` (i.e. ``https://github.com/``), so the token does
          # not leak to unrelated HTTP remotes a future contributor might add
          # in the same workdir. Belt-and-braces: still don't add ``git
          # fetch <other-github-url>`` / ``git submodule update`` here, since
          # those would still target ``${SERVER}`` and receive the header.
          workdir=$(mktemp -d)
          cd "$workdir"
          git init -q
          git remote add origin "${SERVER}/${REPO}.git"
          git config "http.${SERVER}/.extraheader" "AUTHORIZATION: bearer ${GH_TOKEN}"
          git fetch --depth=1 origin "$branch"
          git checkout -q "$branch"
          version=$(jq -r '."."' .release-please-manifest.json)
          # Strict semver-shape check; bail loudly on anything else so a
          # surprise manifest format doesn't silently produce a bad pin.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected manifest version $version"
            exit 1
          fi
          target="${version%.*}"
          # Match :MAJOR.MINOR (no patch) right after the ryzic image name,
          # delimited by EOL or whitespace. Avoid sed's `t` chain — single
          # canonical pin keeps this deterministic.
          if ! grep -qE '^\s*image:\s*ghcr\.io/verylongorgnamesuchwow/ryzic:[0-9]+\.[0-9]+\s*$' compose.yaml; then
            echo "::error::compose.yaml image pin not in expected MAJOR.MINOR shape"
            exit 1
          fi
          sed -i -E "s|(image:\s*ghcr\.io/verylongorgnamesuchwow/ryzic:)[0-9]+\.[0-9]+|\1${target}|" compose.yaml
          if git diff --quiet -- compose.yaml; then
            echo "compose.yaml already pinned to :${target}; nothing to do"
            exit 0
          fi
          git config user.name 'vlonsw-release-please[bot]'
          git config user.email '281041686+vlonsw-release-please[bot]@users.noreply.github.com'
          git add compose.yaml
          git commit -m "chore(release): pin compose.yaml image to :${target}"
          # Local-config http.extraheader (set above) applies to push too.
          git push origin "$branch"
