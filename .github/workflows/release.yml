name: Release

# Builds and publishes a Docker image to GHCR on every `vX.Y.Z` tag.
#
# The tag that triggers this workflow is created by release-please via a
# GitHub App token (see release-please.yml for why GITHUB_TOKEN won't work).
#
# Manual dispatch is the escape hatch when a tag was created some other way
# (manual `git tag`, recovery flow). Run from the GitHub Actions UI or:
#   gh workflow run release.yml --ref main -f tag=v0.X.Y
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build + publish (e.g. v0.X.Y). Required."
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Tying this job to a GitHub Environment gives maintainers a one-click
    # "pause deployments" brake from Settings → Environments → ghcr without
    # editing or disabling the workflow file.
    environment: ghcr
    permissions:
      contents: write       # gh release edit appends the image-digest section to the release notes
      packages: write       # docker push to ghcr.io
      # Required by actions/attest-build-provenance: id-token mints the OIDC
      # token sigstore uses to identify the builder; attestations writes the
      # generated SLSA provenance to the repo's attestations store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}  # input tag on dispatch, pushed tag on push

      # Registers binfmt_misc handlers so the runner can execute arm64
      # binaries during the linux/arm64 leg of the multi-platform build.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the `:vX.Y.Z` and `:vX.Y` tags from the resolved tag, plus
      # `:latest` only on `push` (so a workflow_dispatch rebuild of an old tag
      # cannot move `:latest` backward). `value=` overrides the default semver
      # source (github.ref), which on workflow_dispatch is the dispatching
      # branch — not the input tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          # Multi-arch via QEMU emulation on the single ubuntu-latest runner.
          # `outputs.digest` resolves to the manifest list digest, so the SLSA
          # attestation below covers the whole multi-arch artifact in one shot.
          # If arm64 emulation ever pushes wall-time past ~15min, switch the
          # arm64 leg to a GitHub-hosted arm64 runner (free for public FOSS).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generates SLSA build provenance for the pushed image and uploads it
      # to the repo's attestation store. Users can verify with:
      #   gh attestation verify oci://ghcr.io/<repo>@<digest> --repo <repo>
      # This only succeeds in a real release context (tag push / dispatch
      # against a tag) because OIDC token issuance for the sigstore signer
      # requires `id-token: write` from a workflow run authorized to mint one.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Release notes are owned by release-please (see release-please.yml).
      # By the time this tag fires, the GitHub Release already exists with
      # curated notes from the merged release PR. softprops just attaches
      # the image-digest reference to the body so users can copy a digest-
      # pinned `docker pull` command.
      - name: Append image digest to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="${DISPATCH_TAG:-${GITHUB_REF#refs/tags/}}"
          # Only append if the release exists. Skip silently otherwise (manual
          # tag flows may not have a release yet).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::No release found for $tag; skipping digest append."
            exit 0
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Container image** (digest-pinnable):"
            echo ""
            echo "    docker pull ghcr.io/${GITHUB_REPOSITORY}:${tag#v}"
            echo "    # or by digest:"
            echo "    docker pull ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST:-<digest unavailable>}"
          } >> /tmp/digest-section.md
          gh release view "$tag" --json body --jq .body > /tmp/existing-body.md
          cat /tmp/existing-body.md /tmp/digest-section.md > /tmp/new-body.md
          gh release edit "$tag" --notes-file /tmp/new-body.md
