name: Release dry-run

# Catches packaging breakage before a tag push fires the real Release
# workflow. The Release workflow only runs on tag push, so it cannot
# validate its own changes via PR CI — this is the gate.
#
# Runs on PRs touching anything that shapes the build artifact.

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - compose.dev.yaml
      - lavalink/application.yml
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      # Mirrors release.yml: register binfmt handlers for arm64 emulation.
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      # Multi-arch build (no push, no load) — exercises both legs through
      # QEMU so a Dockerfile change that breaks arm64 fails the dry-run
      # before tag-time. Cache feeds the second build below.
      - name: Build image (multi-arch, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ryzic:dry-run
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Reload only the runner-native amd64 image into the local daemon for
      # the smoke-test step. `load: true` is incompatible with a multi-arch
      # build, hence the split. This is a near-instant cache hit after the
      # multi-arch step above.
      - name: Build image (amd64, load for smoke-test)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ryzic:dry-run
          cache-from: type=gha
      # Smoke-test the built image: it should fail fast on the missing
      # DISCORD_BOT_TOKEN (proves the entrypoint is wired correctly) and
      # NOT die on import errors / missing modules / wrong Python version.
      - name: Smoke-test the image
        run: |
          set +e
          output=$(docker run --rm ryzic:dry-run 2>&1)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "$output"
          if ! echo "$output" | grep -q "DISCORD_BOT_TOKEN"; then
            echo "::error::Image did not fail on missing DISCORD_BOT_TOKEN as expected"
            exit 1
          fi
