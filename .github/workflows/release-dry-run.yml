name: Release dry-run

# Catches packaging breakage before a tag push fires the real Release
# workflow. The Release workflow only runs on tag push, so it cannot
# validate its own changes via PR CI — this is the gate.
#
# Runs on PRs touching anything that shapes the build artifact.

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - compose.dev.yaml
      - lavalink/application.yml
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      # Build the image without pushing; verifies the Dockerfile is valid +
      # the compose-relevant configs aren't broken. Cache hits make this fast
      # on iteration.
      - name: Build image (no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: ryzic:dry-run
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke-test the built image: it should fail fast on the missing
      # DISCORD_BOT_TOKEN (proves the entrypoint is wired correctly) and
      # NOT die on import errors / missing modules / wrong Python version.
      - name: Smoke-test the image
        run: |
          set +e
          output=$(docker run --rm ryzic:dry-run 2>&1)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "$output"
          if ! echo "$output" | grep -q "DISCORD_BOT_TOKEN"; then
            echo "::error::Image did not fail on missing DISCORD_BOT_TOKEN as expected"
            exit 1
          fi
