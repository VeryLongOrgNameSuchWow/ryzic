name: CodeQL

# GitHub-hosted static security analysis. Runs on every PR + push to main, and
# weekly on a schedule so we still scan in quiet weeks. Findings show up in
# the Security tab and block PRs that introduce new issues (configurable in
# repo settings).
#
# Code scanning requires GitHub Advanced Security, which is free on public repos
# but paid on private. The job below is gated on `repository.visibility == 'public'`
# so it skips cleanly while the repo is private and starts running automatically
# the moment the visibility flips.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 07:17 UTC. Off-zero minute on purpose so we don't pile
    # onto every other GHA scheduled job firing at :00.
    - cron: "17 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      actions: read
      contents: read
      security-events: write   # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
