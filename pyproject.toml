[project]
name = "ryzic"
version = "0.3.0"
description = "Self-hostable Discord music bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "riohno", email = "riohno@tutamail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "hikari>=2.4.1",
    "hikari-lightbulb>=3.2,<4",
    "lavalink>=5,<6",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.1.1",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
ryzic = "ryzic.bot:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.16",
    "ruff>=0.15.12",
    "testcontainers>=4.14.2",
    "time-machine>=3.2.0",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# The `lavalink/` directory at the repo root (Lavalink server config) collides
# with isort's same-package detection of the `lavalink` PyPI dependency.
known-third-party = ["lavalink"]

[tool.ty.environment]
# ``./src`` is where the ``ryzic`` package lives; ``./`` exposes the
# top-level ``tests`` package so cross-test helpers
# (``tests/_command_helpers.py``) resolve under the same import path
# pytest uses (``from tests._command_helpers import ...``).
root = ["./src", "./"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests (Docker required) are opt-in: `pytest -m integration` to run them,
# `pytest -q` (the default in CI's fast lane) skips them. The `--cov-fail-under`
# regression gate lives in `.github/workflows/ci.yml` on the unit step so it
# doesn't fail the integration job, which only exercises ~25% of the package.
addopts = "-m 'not integration' --cov=src/ryzic --cov-report=term-missing"
markers = [
    "integration: tests that spin up real services (Docker required)",
]
