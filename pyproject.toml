[project]
name = "ryzic"
version = "0.0.0"
description = "Self-hostable Discord music bot"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "riohno", email = "riohno@tutamail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "hikari>=2.4.1",
    "hikari-lightbulb>=3.2,<4",
    "lavalink>=5,<6",
    "python-dotenv>=1.1.1",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
ryzic = "ryzic.bot:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.12",
    "testcontainers>=4.14.2",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
# The `lavalink/` directory at the repo root (Lavalink server config) collides
# with isort's same-package detection of the `lavalink` PyPI dependency.
known-third-party = ["lavalink"]

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests (Docker required) are opt-in: `pytest -m integration` to run them,
# `pytest -q` (the default in CI's fast lane) skips them.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that spin up real services (Docker required)",
]
