services:
  ryzic:
    # Pinned to the current minor tag so `docker compose pull` picks up
    # patch releases automatically. release-please auto-bumps the major.minor
    # part on each minor release (see .github/workflows/release-please.yml);
    # operators run `docker compose pull && docker compose up -d` after each
    # release. Pre-1.0 minor bumps may include breaking changes — read the
    # release notes (see SEMVER.md).
    image: ghcr.io/verylongorgnamesuchwow/ryzic:0.4
    depends_on:
      lavalink:
        condition: service_healthy
    env_file: .env
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      RYZIC_CACHE_DIR: /var/cache/ryzic
    volumes:
      - cache:/var/cache/ryzic
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    environment:
      _JAVA_OPTIONS: "-Xmx512m"
      SERVER_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set in .env (see .env.example)}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
      - cache:/var/cache/ryzic:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cache:
  lavalink_plugins:
