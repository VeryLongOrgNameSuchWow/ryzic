services:
  ryzic:
    # Pinned to the `:0.1` minor tag: `docker compose pull` picks up 0.1.x
    # patch releases automatically. Bumping to a future `:0.2` is a manual
    # edit — pre-1.0 minor bumps may include breaking changes (see SEMVER.md).
    image: ghcr.io/verylongorgnamesuchwow/ryzic:0.1
    depends_on:
      lavalink:
        condition: service_healthy
    env_file: .env
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      RYZIC_CACHE_DIR: /var/cache/ryzic
    volumes:
      - cache:/var/cache/ryzic
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    environment:
      _JAVA_OPTIONS: "-Xmx512m"
      SERVER_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
      - cache:/var/cache/ryzic:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cache:
  lavalink_plugins:
